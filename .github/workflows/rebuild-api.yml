name: Rebuild deployable API bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API bundle
        run: npm run build:api

      - name: Run project build and video checks
        run: npm run build

      - name: Commit rebuilt API bundle
        shell: bash
        run: |
          if git diff --quiet -- api/index.js; then
            echo "API bundle is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/index.js
          git commit -m "Rebuild deployable API bundle [skip ci]"
          git push
