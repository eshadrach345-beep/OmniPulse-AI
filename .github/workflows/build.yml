name: Build and typecheck

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: TypeScript check
        run: npm run typecheck
      - name: Video provider and quality regression tests
        run: |
          node scripts/test-screenplay.mjs
          node scripts/test-assemble.mjs
          node scripts/test-video-provider-policy.mjs
          node scripts/test-video-quality-gate.mjs
      - name: Build API bundle
        run: npm run build:api
      - name: Build frontend
        run: npm run build
