name: OmniPulse CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and video pipeline regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Typecheck API and app
        run: npm run typecheck
      - name: Build server API bundle
        run: npm run build:api
      - name: Build app and run all video regressions
        run: npm run build
